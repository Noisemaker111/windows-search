<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="shell">
<header><div class="brand"><span class="brand-mark">o<span>c</span></span><span>OpenCode <b>Ask</b></span></div><div class="model-wrap"><select id="model" aria-label="Model"><option value="claude-haiku-4-5-20251001">Haiku</option><option value="gpt-5.6-luna">Luna · low reasoning</option><option value="gpt-5.6-sol">Sol</option><option value="grok-4.6">SuperGrok</option></select><select id="speed" aria-label="Service speed" title="Luna Fast requests priority service and uses more subscription credits. Actual service tier may differ." disabled><option value="normal">Normal</option><option value="fast">Fast · more credits</option></select></div></header>
<div class="search-line"><span id="search-icon"></span><input id="q" aria-label="Ask this PC" placeholder="Search apps, games and projects" autocomplete="off" spellcheck="false" autofocus role="combobox" aria-expanded="false" aria-controls="hits" aria-autocomplete="list"><button id="clear" class="icon-button" aria-label="Clear search" title="Clear search · Escape" hidden></button><button id="ask" aria-label="Ask OpenCode" title="Ask OpenCode · Enter"></button></div>
<div id="status-row"><span id="status" role="status">Your PC, a little closer.</span><span id="timing"></span></div>
<section id="results" hidden><div class="section-label"><span>ON THIS PC</span><span id="count"></span></div><div id="hits" role="listbox" aria-label="Local results"></div></section>
<section id="answer" hidden><div class="answer-heading"><span id="answer-icon"></span><span id="answer-label">OpenCode</span><button id="stop" hidden>Stop <kbd>Esc</kbd></button></div><div id="out" aria-live="polite"></div><div id="sources"></div></section>
<div id="launch" role="status" hidden></div>

<section id="empty"><div class="empty-mark" id="empty-icon"></div><h1>Search this PC</h1><p>Installed apps, Steam libraries, and immediate Projects contents. Web questions use retrieved snippets when available.</p><div class="examples"><button data-query="Where is 7 Days to Die">Find a game <span>↗</span></button><button data-query="Where are my projects">My projects <span>↗</span></button><button data-query="Why is the sky blue?">Ask a question <span>↗</span></button></div></section>
<footer><span id="footer-hint"><kbd>↑</kbd><kbd>↓</kbd> choose <kbd>Enter</kbd> ask</span><span><span class="tiny-dot"></span> OpenCode v2</span></footer>
</main><script type="module" src="/app.js"></script></body></html>
